name: grug-bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

# One run per PR at a time. A new mention waits instead of killing a run
# that may be halfway through a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reply:
    name: reply
    # The repo is public. Checking the commenter here stops anyone else's
    # comment before a step can read a secret. It also stops the bot's own
    # comments, so a reply that quotes "@grug-bot" cannot start another run.
    # Plain issues are left out because the app has no issues permission.
    # A "local" label means a Claude session on the owner's machine is
    # watching the PR and answers instead.
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && !contains(github.event.issue.labels.*.name, 'local')
        && github.event.comment.author_association == 'OWNER'
        && contains(github.event.comment.body, '@grug-bot'))
      || (github.event_name == 'pull_request_review_comment'
        && !contains(github.event.pull_request.labels.*.name, 'local')
        && github.event.comment.author_association == 'OWNER'
        && contains(github.event.comment.body, '@grug-bot'))
      || (github.event_name == 'pull_request_review'
        && !contains(github.event.pull_request.labels.*.name, 'local')
        && github.event.review.author_association == 'OWNER'
        && contains(github.event.review.body, '@grug-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For github.token, which checkout uses and Claude uses to read CI
    # results. Claude writes with the app token below.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: Iv23liGfpEg7thQTfVKN
          private-key: ${{ secrets.GRUG_BOT_PRIVATE_KEY }}
          # Narrower than the app itself, which can also edit workflows.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          trigger_phrase: "@grug-bot"
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without these, commits go out as github-actions[bot].
          bot_name: grug-bot[bot]
          bot_id: "336202702"
          claude_args: --model claude-opus-5-5
          # Installs from main, so a PR's plugin changes show up after merge.
          plugin_marketplaces: https://github.com/evancdev/grug-harness.git
          plugins: grug@grug
